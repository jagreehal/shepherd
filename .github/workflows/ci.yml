name: ci
on:
  push:
    branches: [main] # a PR branch is covered by pull_request; without this filter every PR runs ci twice
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4 # oxlint loads the TS plugin through node; needs type stripping (>=22.18)
        with:
          node-version-file: .node-version
      - run: bun install --frozen-lockfile
      - run: bun run check
        env:
          # Signs gh in, so the pinned-pack integration tests run against real GitHub. The private-pack test runs
          # when the repository has SHEPHERD_IT_TOKEN (read access to the private pack) and the variable
          # SHEPHERD_IT_PRIVATE_LENS (owner/repo/<lens dir>@<sha on its default branch>); without the token it skips.
          GH_TOKEN: ${{ secrets.SHEPHERD_IT_TOKEN || github.token }}
          SHEPHERD_IT_PRIVATE_LENS: ${{ secrets.SHEPHERD_IT_TOKEN && vars.SHEPHERD_IT_PRIVATE_LENS || '' }}
      # The published package is one bundled file with no dependencies: pack it and run it with nothing installed.
      - name: The package runs with no dependencies installed
        run: |
          dir=$(mktemp -d)
          npm pack --pack-destination "$dir" --silent
          tar xzf "$dir"/*.tgz -C "$dir"
          jq -e '.dependencies == null' "$dir/package/package.json"
          git init -q "$dir/repo" && cd "$dir/repo"
          ../package/dist/shepherd.js workflows >/dev/null
          test -f .github/workflows/shepherd.yml && test -f .shepherd/config.yml
