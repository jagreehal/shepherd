# shepherd: one review per push. Installed by `bunx @jagreehal/shepherd gate init` (or `shepherd workflows`).
#
# The review job posts one review: a verdict, what changed, and one inline comment per finding. The settle job resolves
# threads and sets the `shepherd` commit status, which a branch rule can require; it runs again on a person's review,
# so an escalation turns green once someone who can push approves. The model reads the checkout through read, grep and glob only: it runs
# no shell and holds no token. Every GitHub write is made by shepherd's own process or gh with the job's github.token.
#
# Pick a model with the SHEPHERD_MODEL variable (provider/model, e.g. anthropic/claude-opus-5,
# bedrock/eu.amazon.nova-pro-v1:0, opencode-go/deepseek-v4.1-flash, openai/gpt-5.5) or `review.model` in
# .shepherd/config.yml, and add that provider's key as a secret under its usual name. Bedrock without a key uses
# OIDC: `shepherd gate init --aws-oidc` and the AWS_ROLE_ARN variable. Every other setting lives under review: in
# .shepherd/config.yml, read from the default branch; `shepherd gate config` prints what is in effect.
name: shepherd
on:
  # `/review` (or `/gate`) in a PR comment reviews the head again.
  issue_comment:
    types: [created]
  pull_request:
    # `converted_to_draft` and `unlabeled` withdraw the check: the draft and label skip paths reset it. `edited`
    # reviews a base retarget, which changes the diff without moving the head.
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, labeled, unlabeled, edited]
  # A person decides an escalation by approving the head, or takes that back by dismissing the approval. Any review
  # settles the check again, so one submitted after resolving threads turns it green.
  pull_request_review:
    types: [submitted, dismissed]

concurrency:
  # Only runs that review share the PR's group, so a newer review supersedes an older one. A run the job's `if`
  # skips (an ordinary comment, or a bot rewriting the PR description) gets a group of its own, so it never cancels
  # a review in flight. The condition below is the job's `if`, verbatim, except that a comment joins the group only
  # from an OWNER, MEMBER or COLLABORATOR: anyone else's `/review` runs alone, so it cannot cancel a review before
  # shepherd has checked their permission. A test keeps them in step. Overlapping runs order themselves by run marker.
  group: shepherd-${{ github.event.pull_request.number || github.event.issue.number }}-${{ ((github.event_name == 'pull_request' && (github.event.action != 'edited' || github.event.changes.base != null || (github.event.changes.body != null && github.event.sender.login == github.event.pull_request.user.login && contains(github.event.pull_request.body, '<!-- shepherd:review-changes -->')))) || (github.event_name == 'issue_comment' && github.event.action == 'created' && github.event.issue.pull_request != null && (startsWith(github.event.comment.body, '/review') || startsWith(github.event.comment.body, '/gate')) && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association))) && 'review' || github.run_id }}
  cancel-in-progress: true # a newer head supersedes the review in flight

permissions:
  # The review job holds the model keys and installs shepherd, so it cannot change code. Resolving a
  # thread needs contents write: the settle job below has it, with no keys and nothing installed.
  contents: read
  pull-requests: write
  statuses: write # the shepherd check
  # Reads the PR's reactions (the issues API serves them) to wait for reviewer bots still at work.
  issues: read
  # Reads the test-evidence artifact when policy sets `stories:`.
  actions: read
  # Reads reviewer check runs, such as Claude Code Review, to wait while one is running.
  checks: read
  #aws-oidc id-token: write # Bedrock through OIDC: the AWS step exchanges it for the role's credentials

jobs:
  review:
    # No draft/bot/label filter here on purpose: shepherd itself decides whether to review, and it resets the check
    # on every skip path. A job-level `if` would skip that too. Only people who could merge anyway may start a run
    # with a comment: shepherd checks the commenter's permission first and exits without touching anything
    # otherwise. That check is not here because author_association reads write access through a team, and a
    # private org member, as CONTRIBUTOR.
    if: >-
      (github.event_name == 'pull_request' && (github.event.action != 'edited' || github.event.changes.base != null || (github.event.changes.body != null && github.event.sender.login == github.event.pull_request.user.login && contains(github.event.pull_request.body, '<!-- shepherd:review-changes -->'))))
      || (github.event_name == 'issue_comment' && github.event.action == 'created' && github.event.issue.pull_request != null
          && (startsWith(github.event.comment.body, '/review') || startsWith(github.event.comment.body, '/gate')))
    runs-on: ubuntu-latest
    outputs:
      head: ${{ steps.settle.outputs.head }}
      retire: ${{ steps.settle.outputs.retire }}
      verdict: ${{ steps.settle.outputs.verdict }}
      state: ${{ steps.settle.outputs.state }}
      description: ${{ steps.settle.outputs.description }}
    timeout-minutes: 20 # a hung model call must not burn a runner for six hours; a killed run leaves the check pending
    env:
      SHEPHERD_VERSION: ${{ vars.SHEPHERD_VERSION || '0.23.0' }} # pinned: the engine decides the verdict, so bumps are deliberate; the SHEPHERD_VERSION variable overrides it
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }} # on a comment event gate fetches the head itself
          persist-credentials: false # no token in .git/config for a reviewer to read; gate's fetches authenticate through gh
          fetch-depth: 1 # gate fetches the base ref and origin/<default> itself, and unshallows only when a run reaches the familiarity signal
      # Bedrock through OIDC (`shepherd gate init --aws-oidc`). The provider reads the credentials this step exports.
      # A failed exchange must not skip the review: it then ends in ERROR for want of credentials, and the check says
      # so. A `pull_request` run from a fork gets no OIDC token; a `/review` comment runs in this repository and gets one.
      #aws-oidc - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
      #aws-oidc   continue-on-error: true
      #aws-oidc   with:
      #aws-oidc     role-to-assume: ${{ vars.AWS_ROLE_ARN }}
      #aws-oidc     aws-region: ${{ vars.AWS_REGION }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0: pinned, this job holds model keys
      - run: bunx "@jagreehal/shepherd@$SHEPHERD_VERSION" gate "$PR" --post --json "$RUNNER_TEMP/gate.json" --settle "$RUNNER_TEMP/settle.json"
        env:
          PR: ${{ github.event.pull_request.number || github.event.issue.number }}
          GH_TOKEN: ${{ github.token }}
          SHEPHERD_BOT_LOGIN: github-actions[bot]
          SHEPHERD_CLI_IMAGE: gate-reviewer:local
          SHEPHERD_BUILD_CLI_IMAGE: '1' # prepared after the deterministic checks, only for a CLI backend
          # Set the key for your provider; the others stay empty.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          AWS_BEARER_TOKEN_BEDROCK: ${{ secrets.AWS_BEARER_TOKEN_BEDROCK }} # leave empty for OIDC (step above)
          OPENAI_COMPATIBLE_API_KEY: ${{ secrets.OPENAI_COMPATIBLE_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }} # backends: [claude]
          CODEX_API_KEY: ${{ secrets.CODEX_API_KEY }}               # backends: [codex]
          OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          SHEPHERD_NOTIFY_WEBHOOK: ${{ secrets.SHEPHERD_NOTIFY_WEBHOOK }} # Slack Incoming Webhook or any URL that takes JSON
          SHEPHERD_MODEL: ${{ vars.SHEPHERD_MODEL }}
          OPENAI_COMPATIBLE_BASE_URL: ${{ vars.OPENAI_COMPATIBLE_BASE_URL }}
          ANTHROPIC_BASE_URL: ${{ vars.ANTHROPIC_BASE_URL }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ vars.OTEL_EXPORTER_OTLP_ENDPOINT }}
      # The threads to resolve and the check, for the settle job. Read as data: every field is checked before it is an output.
      # Runs after a failed review too: an ERROR writes its settlement, and the check must still leave pending.
      - id: settle
        if: ${{ !cancelled() }}
        run: |
          f="$RUNNER_TEMP/settle.json"
          [ -f "$f" ] || exit 0
          jq -e '(.head | test("^[0-9a-f]{40}$")) and (.retire | all(test("^PRRT_[A-Za-z0-9_-]+$"))) and (.verdict | IN("APPROVED", "REFUSED", "ESCALATE", "ERROR")) and (.check.state | IN("success", "failure", "pending", "error"))' "$f" >/dev/null
          {
            echo "head=$(jq -r .head "$f")"
            echo "retire=$(jq -r '.retire | join(" ")' "$f")"
            echo "verdict=$(jq -r .verdict "$f")"
            echo "state=$(jq -r .check.state "$f")"
            echo "description=$(jq -r '.check.description | explode | map(select(. >= 32)) | implode | .[0:139]' "$f")"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gate-evidence-${{ github.event.pull_request.number || github.event.issue.number }}
          path: ${{ runner.temp }}/gate.json

  # Settles the check. After a review it resolves the threads the review settled; on a person's review it reads the PR
  # again. Either way it works from GitHub as it is now: the verdict on this head, the open threads of shepherd's or a
  # person's, and the latest decision of everyone who can push. An escalation turns green once one of them approved
  # this head and no thread is open; a refusal never does. Contents write lives here, apart from the model keys: no
  # checkout, no install, only the gh that ships on the runner, and the event's values reach it only as data.
  settle:
    needs: review
    if: ${{ !cancelled() && (needs.review.outputs.head != '' || github.event_name == 'pull_request_review') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # GitHub requires it to resolve a review thread
      pull-requests: write
      statuses: write
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number || github.event.issue.number }}
      HEAD_SHA: ${{ needs.review.outputs.head || github.event.pull_request.head.sha }}
      RETIRE: ${{ needs.review.outputs.retire }}
      VERDICT: ${{ needs.review.outputs.verdict }}
      STATE: ${{ needs.review.outputs.state }}
      DESCRIPTION: ${{ needs.review.outputs.description }}
    steps:
      - name: Resolve the settled threads and set the check
        run: |
          set_check() { gh api "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" -f context=shepherd -f state="$1" -f description="${2:0:139}" >/dev/null; }
          reviews() { gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/reviews" --paginate | jq -s 'add // []'; }
          for id in $RETIRE; do
            t=$(gh api graphql -f query='query($id:ID!){node(id:$id){... on PullRequestReviewThread{isResolved comments(first:50){totalCount nodes{author{login __typename} body}}}}}' -f id="$id") || continue
            # Shepherd's alone, read whole: every comment from the Actions bot, carrying the review's run marker.
            if jq -e '.data.node | (.isResolved | not) and .comments.totalCount == (.comments.nodes | length) and (.comments.nodes | length) > 0 and all(.comments.nodes[]; .author.__typename == "Bot" and .author.login == "github-actions" and (.body | contains("<!-- gate-run:")))' <<<"$t" >/dev/null; then
              gh api graphql -f query='mutation($id:ID!){resolveReviewThread(input:{threadId:$id}){thread{id}}}' -f id="$id" >/dev/null || true
            fi
          done
          now=""
          if [ -z "$VERDICT" ]; then
            # A person's review: a review still running settles the head itself.
            now=$(gh api "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/statuses" --jq '[.[] | select(.context == "shepherd")][0] | "\(.state) \(.description)"')
            case "$now" in pending*) exit 0 ;; esac
            VERDICT=$(reviews | jq -r --arg h "$HEAD_SHA" '[.[] | select(.user.login == "github-actions[bot]" and .commit_id == $h and (.body | contains("<!-- gate-run:")))] | last | ((.body // "") | split("\n")[0] // "") | (capture(": (?<v>APPROVED|REFUSED|ESCALATE|ERROR)\\b").v // "")')
          fi
          case "$VERDICT" in
            APPROVED | ESCALATE) ;;
            *) [ -n "$STATE" ] && set_check "$STATE" "$DESCRIPTION"; exit 0 ;;
          esac
          # Open threads, read after resolving: shepherd's, a person's, or one read in part. Other tools' threads are theirs.
          open=$(gh api graphql --paginate -f query='query($o:String!,$n:String!,$p:Int!,$endCursor:String){repository(owner:$o,name:$n){pullRequest(number:$p){reviewThreads(first:100,after:$endCursor){pageInfo{hasNextPage endCursor} nodes{isResolved comments(first:50){totalCount nodes{author{login __typename}}}}}}}}' -f o="${GITHUB_REPOSITORY%/*}" -f n="${GITHUB_REPOSITORY#*/}" -F p="$PR" \
            | jq -s '[.[].data.repository.pullRequest.reviewThreads.nodes[] | select((.isResolved | not) and (.comments.totalCount > (.comments.nodes | length) or any(.comments.nodes[]; .author == null or .author.__typename != "Bot" or .author.login == "github-actions")))] | length')
          left=""
          [ "$open" -gt 0 ] && left="; $open open thread(s) to resolve, then approve again"
          if [ "$VERDICT" = APPROVED ]; then
            if [ "$open" -eq 0 ]; then set_check success "approved; no open thread"; else set_check failure "approved; $open open thread(s) to resolve"; fi
            exit 0
          fi
          # An escalation: the latest decision of each person, on this head, from someone who can push.
          who=""
          for u in $(reviews | jq -r --arg h "$HEAD_SHA" '[.[] | select(.state != "COMMENTED" and .state != "PENDING" and .user.type != "Bot")] | group_by(.user.login) | map(last) | .[] | select(.state == "APPROVED" and .commit_id == $h) | .user.login'); do
            case "$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$u/permission" --jq .permission 2>/dev/null || true)" in admin | maintain | write) who=$u; break ;; esac
          done
          if [ -n "$who" ] && [ "$open" -eq 0 ]; then set_check success "approved by $who"
          elif [ -n "$who" ]; then set_check failure "a person decides: approved by $who$left"
          elif [ -n "$STATE" ]; then set_check "$STATE" "$DESCRIPTION"
          else case "$now" in *"approved by"*) set_check failure "a person decides: no approval of this head from someone who can push" ;; esac
          fi
